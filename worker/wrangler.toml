name = "pred-zori-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Main provider: any OpenAI-compatible endpoint. Current: Google Gemini (free tier via Google AI Studio).
# The API_KEY secret must be a key for this provider.
BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
# Check your provider's docs for the current model names.
MODEL = "gemini-3.5-flash-lite"

# Fallback: used once when MODEL is busy (5xx), rate-limited (429) or too slow (TIMEOUT_MS).
# Leave FALLBACK_MODEL empty to disable it.
# Same provider as MODEL:  leave FALLBACK_BASE_URL empty; API_KEY and REASONING_EFFORT are reused.
# Another provider:        set FALLBACK_BASE_URL and FALLBACK_REASONING_EFFORT here, and the key with
#                          npx wrangler secret put FALLBACK_API_KEY
# Current: Groq (fast inference, free tier via console.groq.com, models at console.groq.com/docs/models).
FALLBACK_MODEL = "openai/gpt-oss-120b"
FALLBACK_BASE_URL = "https://api.groq.com/openai/v1"

# Milliseconds to wait for the first response from MODEL before switching to FALLBACK_MODEL,
# how long the fallback gets, and the longest pause allowed mid-stream before giving up.
# The game itself gives up after 50 s without any data, so keep TIMEOUT_MS + FALLBACK_TIMEOUT_MS below that.
TIMEOUT_MS = "15000"
FALLBACK_TIMEOUT_MS = "25000"
IDLE_TIMEOUT_MS = "20000"
# Reasoning models (gpt-oss, Gemini 2.5+/3) count hidden reasoning tokens against this limit, so keep headroom.
MAX_TOKENS = "4000"
# Caps hidden "thinking" so it can't use up MAX_TOKENS and cut replies mid-sentence (main provider; see
# FALLBACK_REASONING_EFFORT above). gpt-oss and Gemini 3 accept low/medium/high. Leave empty for models that reject it.
REASONING_EFFORT = "low"
FALLBACK_REASONING_EFFORT = "low"
# Comma-separated list of sites allowed to call this worker. Replace YOUR-USERNAME.
ALLOWED_ORIGINS = "https://dimisko.github.io,https://viktor-nikolov-pred-zori.vercel.app,http://localhost:8000"

# The API keys are NOT stored here. Set them as secrets:
#   npx wrangler secret put API_KEY
#   npx wrangler secret put FALLBACK_API_KEY   (only when FALLBACK_BASE_URL is set)
